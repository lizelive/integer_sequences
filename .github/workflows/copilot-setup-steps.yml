name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Cargo.toml
      - Cargo.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies
        run: cargo fetch
